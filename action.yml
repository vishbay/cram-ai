name: "cram audit"
description: "Post a token-waste audit / rig success-gate as a sticky pull-request comment."
branding:
  icon: "bar-chart-2"
  color: "purple"

inputs:
  mode:
    description: "compare | report | rig"
    default: "compare"
  cram-version:
    description: "Pinned cram-ai version from PyPI"
    default: "0.9.0"
  file-a:
    description: "Baseline JSON (compare/rig modes)"
    required: false
  file-b:
    description: "Candidate JSON (compare/rig modes)"
    required: false
  compare-json:
    description: "A single `cram audit --compare A B --json` document (compare mode)"
    required: false
  report-json:
    description: "A single `cram audit --json` document (report mode)"
    required: false
  tolerance:
    description: "Max allowed success-rate drop before the rig gate fails (e.g. 0.1)"
    default: "0.0"
  comment:
    description: "Post/update a sticky PR comment"
    default: "true"
  github-token:
    description: "Token used to comment"
    default: ${{ github.token }}

outputs:
  passed:
    description: "true unless the rig gate failed"
    value: ${{ steps.run.outputs.passed }}
  comment-body:
    description: "Rendered markdown"
    value: ${{ steps.run.outputs.comment-body }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install cram-ai
      shell: bash
      run: python -m pip install "cram-ai==${{ inputs.cram-version }}"

    - name: Render
      id: run
      shell: bash
      env:
        CRAM_SUMMARY: ${{ runner.temp }}/cram-comment.md
      run: |
        args=(--mode "${{ inputs.mode }}" --tolerance "${{ inputs.tolerance }}" --out "$CRAM_SUMMARY")
        [ -n "${{ inputs.file-a }}" ]       && args+=(--file-a "${{ inputs.file-a }}")
        [ -n "${{ inputs.file-b }}" ]       && args+=(--file-b "${{ inputs.file-b }}")
        [ -n "${{ inputs.compare-json }}" ] && args+=(--compare-json "${{ inputs.compare-json }}")
        [ -n "${{ inputs.report-json }}" ]  && args+=(--report-json "${{ inputs.report-json }}")
        set +e
        python -m cram.ci "${args[@]}"
        echo "exit=$?" >> "$GITHUB_OUTPUT"
        # Always mirror the comment into the job summary so it's visible even
        # when commenting is disabled (e.g. fork PRs with a read-only token).
        cat "$CRAM_SUMMARY" >> "$GITHUB_STEP_SUMMARY" || true

    - name: Sticky PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- cram-audit-bot -->';
          const body = fs.readFileSync(process.env.RUNNER_TEMP + '/cram-comment.md', 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Enforce gate
      shell: bash
      run: |
        if [ "${{ steps.run.outputs.passed }}" = "false" ]; then
          echo "::error::cram rig gate failed — an optimization lowered task success."
          exit 1
        fi
