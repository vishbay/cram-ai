[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cram-ai"
version = "0.11.2"
description = "The profiler and referee for AI coding-agent tokens — audit where agent spend goes from real transcripts, get evidence-backed fixes, and verify any optimization actually worked"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Vish Bayavarapu" }]
requires-python = ">=3.10"
keywords = ["ai", "llm", "context", "token", "coding", "claude", "cursor", "copilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.40.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
multi-provider = ["litellm>=1.40.0"]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cram = "cram.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Default rules (pyflakes + a pycodestyle subset). Ignore deliberate style here:
#   E741 short names like `l`/`e` read fine in tight code,
#   E701/E702 compact one-line guards (`if not x: return`) are intentional,
#   E402 a few modules order imports after constants on purpose.
ignore = ["E741", "E701", "E702", "E402"]

[project.urls]
Homepage = "https://github.com/vishbay/cram-ai"
Repository = "https://github.com/vishbay/cram-ai"
"Bug Tracker" = "https://github.com/vishbay/cram-ai/issues"

[tool.setuptools.packages.find]
include = ["cram*"]
